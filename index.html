<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LA REAL · Growth Advisory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0D1B2A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box{max-width:460px}
.logo{font-size:26px;font-weight:900;letter-spacing:-1.5px;display:inline-flex;align-items:baseline;gap:9px;margin-bottom:18px}
.logo .dot{width:8px;height:8px;border-radius:50%;background:#44BF48}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
p{color:#9ca3af;font-size:15px;line-height:1.6}
.tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#44BF48;font-weight:700;margin-bottom:14px}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">LA REAL<span class="dot"></span></div>
    <div class="tag">Growth Advisory</div>
    <h1>Análisis financiero privado</h1>
    <p>Cada análisis tiene un enlace único y privado. Si eres cliente del programa, usa el enlace que te compartió tu asesor.</p>
  </div>
</body>
</html>
